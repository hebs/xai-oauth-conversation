name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build integration archive
        run: |
          cd custom_components/xai_oauth_conversation
          zip -r ../../xai_oauth_conversation.zip . -x '*/__pycache__/*' '*.pyc'
      - name: Upload release archive
        uses: softprops/action-gh-release@v2
        with:
          files: xai_oauth_conversation.zip
